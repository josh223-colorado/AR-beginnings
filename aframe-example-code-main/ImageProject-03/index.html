<!DOCTYPE html>
<html>
  <head>
    <title>VR Studio Room - A-Frame</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <link rel="stylesheet" type="text/css" href="main.css">
  </head>

  <body>
    <a-scene>

      <!-- ASSETS -->
      <a-assets>
        <img id="wallTexture" src="assets/wallTexture.jpg.png">
        <img id="ceilingTexture" src="assets/ceilingTexture.jpg.png">
      </a-assets>

      <!-- FLOOR -->
      <a-plane 
        position="0 0 0"
        rotation="-90 0 0"
        width="14" height="14"
        color="#f0f0f0">
      </a-plane>

      <!-- TALLER CEILING (height 6.5) -->
      <a-plane 
        position="0 6.5 0"
        rotation="90 0 0"
        width="14" height="14"
        material="src: #ceilingTexture; repeat: 5 5; metalness:0.1; roughness:0.8;">
      </a-plane>

      <!-- WALLS (6.5 units tall) -->
      <a-plane position="0 3.25 -7" rotation="0 0 0" width="14" height="6.5"
               material="src: #wallTexture; repeat: 5 2;"></a-plane>

      <a-plane position="0 3.25 7" rotation="0 180 0" width="14" height="6.5"
               material="src: #wallTexture; repeat: 5 2;"></a-plane>

      <a-plane position="-7 3.25 0" rotation="0 90 0" width="14" height="6.5"
               material="src: #wallTexture; repeat: 5 2;"></a-plane>

      <a-plane position="7 3.25 0" rotation="0 -90 0" width="14" height="6.5"
               material="src: #wallTexture; repeat: 5 2;"></a-plane>

      <!-- ============ DESK CONTROL CENTER ============ -->

      <!-- Center Desk Surface -->
      <a-box position="0 0.75 -2"
             depth="1.2" height="0.1" width="2.4"
             color="#e6e6e6"
             material="roughness:0.8; metalness:0.1;">
      </a-box>

      <!-- Left Console -->
      <a-box position="-1.3 0.7 -2"
             depth="1" height="0.5" width="1"
             rotation="-20 0 0"
             color="#e6e6e6">
      </a-box>

      <!-- Right Console -->
      <a-box position="1.3 0.7 -2"
             depth="1" height="0.5" width="1"
             rotation="-20 0 0"
             color="#e6e6e6">
      </a-box>

      <!-- Center Monitor -->
      <a-plane position="0 1.65 -2.2"
               width="1.8" height="1"
               color="#000000"
               material="shader: flat;">
      </a-plane>

      <!-- Left Control Screen -->
      <a-plane position="-1.25 1.1 -2.1"
               rotation="-15 0 0"
               width="0.9" height="0.5"
               color="#111">
      </a-plane>

      <!-- Right Control Screen -->
      <a-plane position="1.25 1.1 -2.1"
               rotation="-15 0 0"
               width="0.9" height="0.5"
               color="#111">
      </a-plane>

      <!-- ============ LIGHTING ============ -->
      <a-entity light="type: ambient; intensity: 0.6"></a-entity>

      <!-- Spotlights overhead -->
      <a-entity light="type: spot; intensity: 1; angle:40" position="0 6.3 0"></a-entity>
      <a-entity light="type: spot; intensity: 1; angle:40" position="-2 6.3 -1"></a-entity>
      <a-entity light="type: spot; intensity: 1; angle:40" position="2 6.3 1"></a-entity>

      <!-- CAMERA -->
      <a-entity position="0 1.6 2.5">
        <a-camera wasd-controls look-controls></a-camera>
      </a-entity>

    </a-scene>
  </body>
</html>
